name: Production Launch Engine Pipeline

on:
  push:
    branches: [ main ] # Triggers launch code compilation when code hits your main development tree

permissions:
  contents: write

jobs:
  build-and-launch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Setup Node.js Build Engine Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install System Dependencies
      run: npm ci

    - name: Run Integrity Matrix Unit Tests
      run: npm run test --if-present

    - name: Compile and Minify Production Assets
      run: npm run build

    # Target A: Deploy to GitHub Pages (Great for instant web portfolios)
    - name: Deploy Live Assets to Public Web Target
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist # Points exactly to your minified production build target folder
        branch: gh-pages # Deploys to clean separate tracking distribution branch
        
